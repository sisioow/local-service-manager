<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机服务管理台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182338;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1500px;margin:48px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;margin:8px 0}p{color:#6a778d;line-height:1.7}.badge{color:#168465;background:#e1f4ed;padding:8px 12px;border-radius:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0 16px}input[type=search]{flex:1;min-width:240px;padding:12px 15px;border:1px solid #dce1eb;border-radius:9px;font:inherit}button{cursor:pointer;border:1px solid #dce1eb;background:white;padding:10px 14px;border-radius:8px;color:#33445f;font:inherit}button:hover{background:#edf2fc}button:disabled{opacity:.45;cursor:not-allowed}.danger{color:#c43b44}.primary{color:white;background:#3868dc;border-color:#3868dc}.primary:hover{background:#2855c0}.panel{background:white;border:1px solid #e3e8f1;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th{text-align:left;background:#fafbfe;color:#748097;font-size:12px}th,td{padding:15px 14px;border-bottom:1px solid #edf0f5;vertical-align:top}td small{display:block;color:#8792a5;margin-top:7px}.port{display:inline-block;background:#edf2ff;color:#3760b7;padding:4px 7px;border-radius:5px;margin:0 4px 5px 0}code{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.path{max-width:460px;white-space:normal;line-height:1.7}.actions{white-space:nowrap}.actions button{padding:6px 9px;margin-right:5px}#status{color:#718096;margin:12px 0}#results{white-space:pre-wrap;line-height:1.9;padding:16px;border-radius:9px;background:#eaf0fc;display:none}footer{color:#8190a6;margin-top:18px;line-height:1.8}input[type=checkbox]{width:16px;height:16px;cursor:pointer}
</style></head><body><main><header><div><span style="color:#3868dc;font-weight:600">LOCAL SERVICE MANAGER</span><h1>本机服务管理台</h1><p>查看监听端口与启动路径，集中管理正在运行的服务。</p></div><span class="badge">本地访问 · 9990</span></header>
<div class="toolbar"><input id="search" type="search" placeholder="搜索应用、端口、进程、PID 或路径…"><button id="refresh">刷新</button><button id="restart" class="primary">重启所选</button><button id="stop" class="danger">关闭所选</button><label><input id="auto" type="checkbox" checked> 自动刷新</label></div><div id="status">正在加载…</div><div id="results" role="status"></div>
<div class="panel"><table><thead><tr><th><input id="all" type="checkbox" aria-label="选择当前列表全部进程"></th><th>归属应用</th><th>进程 / PID</th><th>监听端口</th><th>路径 / 启动命令</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<footer>每行对应一个进程。关闭进程会释放其全部端口；受系统权限限制的进程可能无法显示或操作。<br>重启使用原启动参数、工作目录和环境变量。由系统或其他管理器托管的服务可能被自动拉起，建议在对应管理器中操作。</footer></main>
<script>
const token='__TOKEN__';let rows=[],selected=new Set(),busy=false,denied=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=r=>`${r.pid}:${r.created}`;
function filtered(){let q=$('search').value.trim().toLowerCase();return rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}
function render(){let visible=filtered();$('rows').innerHTML=visible.map(r=>`<tr><td><input type="checkbox" data-select="${key(r)}" ${selected.has(key(r))?'checked':''} ${r.protected||busy?'disabled':''} aria-label="选择 ${esc(r.name)}"></td><td title="${esc(r.app_path)}"><strong>${esc(r.app_name)}</strong><small>${esc(r.app_source)}</small></td><td><strong>${esc(r.name)}</strong><small>PID ${r.pid} · ${esc(r.user)}</small>${r.protected?'<small>受保护</small>':''}</td><td>${r.ports.map(p=>`<span class="port">${p}</span>`).join('')}<small>${r.addresses.map(esc).join('<br>')}</small></td><td class="path"><code>${esc(r.executable||'路径不可读取')}</code><small>工作目录：${esc(r.cwd||'不可读取')}</small><details><summary>启动命令</summary><code>${esc(r.command.map(a=>JSON.stringify(a)).join(' '))}</code></details></td><td class="actions"><button data-action="restart" data-key="${key(r)}" ${r.protected||busy?'disabled':''}>重启</button><button class="danger" data-action="stop" data-key="${key(r)}" ${r.protected||busy?'disabled':''}>关闭</button></td></tr>`).join('')||'<tr><td colspan="6">没有匹配的监听服务</td></tr>';
$('status').textContent=`共 ${rows.length} 个服务 · 当前显示 ${visible.length} 个 · 已选 ${selected.size} 个${denied?' · '+denied+' 个进程因权限限制未能检查':''}`;for(let id of ['restart','stop'])$(id).disabled=busy||!selected.size;$('refresh').disabled=busy;let selectable=visible.filter(r=>!r.protected);$('all').checked=selectable.length>0&&selectable.every(r=>selected.has(key(r)));$('all').disabled=busy;$('all').indeterminate=selectable.some(r=>selected.has(key(r)))&&!$('all').checked}
async function refresh(){if(busy)return;try{let res=await fetch('/api/services');if(!res.ok)throw Error('获取服务失败');let data=await res.json();rows=data.services;denied=data.denied;selected=new Set([...selected].filter(k=>rows.some(r=>key(r)===k)));render()}catch(e){$('status').textContent='刷新失败：'+e.message}}
async function act(action,items){if(busy||!items.length)return;let verb=action==='stop'?'关闭':'重启';if(!confirm(`确定${verb}这 ${items.length} 个进程？\n${items.map(r=>r.app_name+' / '+r.name+' (PID '+r.pid+'，端口 '+r.ports.join(', ')+')').join('\n')}\n\n操作会中断这些进程的当前连接，并影响其全部端口。`))return;busy=true;render();$('results').style.display='block';$('results').textContent=`正在${verb}，请稍候…`;try{let res=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify({action,items:items.map(r=>({pid:r.pid,created:r.created}))})});let data=await res.json();if(!res.ok)throw Error(data.error);$('results').textContent=data.results.map(r=>`${r.ok?'✓':'✗'} PID ${r.pid}：${r.message}`).join('\n');selected.clear()}catch(e){$('results').textContent='操作失败：'+e.message}finally{busy=false;await refresh();render()}}
$('rows').addEventListener('change',e=>{let k=e.target.dataset.select;if(k){e.target.checked?selected.add(k):selected.delete(k);render()}});$('rows').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)act(b.dataset.action,rows.filter(r=>key(r)===b.dataset.key))});$('all').onchange=e=>{filtered().filter(r=>!r.protected).forEach(r=>e.target.checked?selected.add(key(r)):selected.delete(key(r)));render()};$('search').oninput=render;$('refresh').onclick=refresh;for(let action of ['stop','restart'])$(action).onclick=()=>act(action,rows.filter(r=>selected.has(key(r))));setInterval(()=>{if($('auto').checked)refresh()},5000);refresh();
</script></body></html>
